header{

.hero-content{

.hero h1{

.section{

.section-head{

  justify-content:space-between;
  gap:20px;
  margin-bottom:25px;
}

.section-head h2{
  font-size:30px;
}

.filters{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.filters input,
.filters select{
  background:#111;

  outline:none;
}

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.product{
  background:#111;
  border:1px solid #222;
  border-radius:10px;
  overflow:hidden;
  transition:.2s;
}

.product:hover{
  transform:translateY(-4px);
  border-color:#555;
}

.product-image{
  width:100%;
  aspect-ratio:1/1.15;
  object-fit:cover;
  display:block;
  background:#181818;
}

.product-info{
  padding:15px;
}

.product-name{
  font-size:15px;
  font-weight:bold;
  margin-bottom:6px;
}

.product-category{
  color:#888;
  font-size:12px;
  margin-bottom:10px;
}

.product-price{
  font-size:19px;
  font-weight:bold;
  margin-bottom:12px;
}

.size-select{
  width:100%;
  background:#080808;
  color:#fff;
  border:1px solid #333;
  padding:10px;
  border-radius:6px;
  margin-bottom:9px;
}

.add-btn{
  width:100%;
  background:#fff;
  color:#000;
  border:none;
  padding:11px;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
}

.add-btn:hover{
  background:#ddd;
}

.features{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.feature{
  background:#111;
  border:1px solid #222;
  border-radius:10px;
  padding:25px;
}

.feature h3{
  margin-bottom:10px;
}

.feature p{
  color:#999;
  line-height:1.5;
  font-size:14px;
}

footer{
  border-top:1px solid #222;
  padding:30px 5%;
  text-align:center;
  color:#777;
  font-size:13px;
}

function renderProducts(){

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase();

  const category =
    document.getElementById("category").value;

  const sort =
    document.getElementById("sort").value;


  let list = products.filter(product => {

    const searchMatch =
      product.name
        .toLowerCase()
        .includes(search);

    const categoryMatch =
      category === "all" ||
      product.category === category;

    return searchMatch && categoryMatch;

  });


  if(sort === "low"){
    list.sort((a,b) => a.price - b.price);
  }

  if(sort === "high"){
    list.sort((a,b) => b.price - a.price);
  }


  const container =
    document.getElementById("products");


  container.innerHTML = list.map(product => `

    <div class="product">

      <img
        class="product-image"
        src="${product.image}"
        alt="${product.name}"
        loading="lazy"
      >

      <div class="product-info">

        <div class="product-name">
          ${product.name}
        </div>

        <div class="product-category">
          ${product.category}
        </div>

        <div class="product-price">
          ₹${product.price}
        </div>

        <select
          class="size-select"
          id="size-${product.id}"
        >

          ${product.sizes.map(size => `
            <option value="${size}">
              Size ${size}
            </option>
          `).join("")}

        </select>

        <button
          class="add-btn"
          onclick="addToCart(${product.id})"
        >
          ADD TO CART
        </button>

      </div>

    </div>

  `).join("");

}
