
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZAVEON™ | Wear Your Edge</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #050505;
      color: white;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 4px;
    }

    nav a {
      color: #aaa;
      text-decoration: none;
      margin-left: 15px;
      font-size: 13px;
    }

    .hero {
      min-height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: radial-gradient(circle, #292929, #050505 65%);
      padding: 30px;
    }

    .hero h1 {
      font-size: 60px;
      letter-spacing: 7px;
    }

    .hero p {
      color: #aaa;
      letter-spacing: 5px;
      margin: 20px 0 30px;
    }

    .button {
      display: inline-block;
      background: white;
      color: black;
      padding: 15px 25px;
      text-decoration: none;
      font-weight: bold;
    }

    section {
      padding: 70px 20px;
    }

    .title {
      text-align: center;
      letter-spacing: 4px;
      margin-bottom: 40px;
    }

    .product {
      max-width: 350px;
      margin: auto;
      background: #111;
      padding: 15px;
      border: 1px solid #333;
    }

    .shirt {
      height: 350px;
      background: linear-gradient(145deg, #292929, #080808);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      letter-spacing: 4px;
      font-weight: bold;
    }

    .product h3 {
      margin-top: 20px;
    }

    .product p {
      color: #888;
      margin: 10px 0;
    }

    .price {
      font-size: 20px;
      margin: 15px 0;
    }

    select {
      width: 100%;
      padding: 12px;
      background: #050505;
      color: white;
      border: 1px solid #444;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      background: white;
      color: black;
      font-weight: bold;
    }

    .about {
      max-width: 700px;
      margin: auto;
      text-align: center;
      color: #999;
      line-height: 1.7;
    }

    footer {
      text-align: center;
      padding: 30px;
      border-top: 1px solid #222;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">ZAVEON™</div>

  <nav>
    <a href="#shop">SHOP</a>
    <a href="#about">ABOUT</a>
  </nav>
</header>

<div class="hero">
  <div>
    <h1>ZAVEON</h1>
    <p>WEAR YOUR EDGE.</p>
    <a class="button" href="#shop">SHOP ORIGIN 01</a>
  </div>
</div>

<section id="shop">
  <h2 class="title">ORIGIN 01</h2>

  <div class="product">

    <div class="shirt">
      ZAVEON
    </div>

    <h3>ORIGIN 01 — OVERSIZED TEE</h3>

    <p>Premium Black Streetwear</p>

    <div class="price">₹499</div>

    <select>
      <option>Select Size</option>
      <option>S</option>
      <option>M</option>
      <option>L</option>
      <option>XL</option>
    </select>

    <button onclick="alert('Coming soon!')">
      ADD TO CART
    </button>

  </div>
</section>

<section id="about">
  <h2 class="title">ABOUT ZAVEON</h2>

  <div class="about">
    ZAVEON™ is a premium streetwear brand built around
    individuality, confidence and modern design.
    <br><br>
    <b>WEAR YOUR EDGE.</b>
  </div>
</section>

<footer>
  © 2026 ZAVEON™ — WEAR YOUR EDGE.
</footer>

</body>
</html>
